name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: chmod +x gradlew
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CraftCanvasLudo
          path: build/libs/CraftCanvasLudo-*.jar
